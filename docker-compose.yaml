services:
  dev:
    container_name: apply_interview_backend
    image: apply_interview_backend:1.0.0
    build:
      context: .
      target: development
      dockerfile: ./Dockerfile
    command: npm run start:debug
    ports:
      - 3000:3000
      - 9229:9229
    networks:
      - apply_interview_backend-network
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    restart: unless-stopped

  postgres:
    container_name: apply_interview_backend-postgres-1
    image: postgres
    restart: always
    environment:
      POSTGRES_DB: ${TYPEORM_DATABASE}
      POSTGRES_USER: ${TYPEORM_USERNAME}
      POSTGRES_PASSWORD: ${TYPEORM_PASSWORD}
    ports:
      - '5432:5432'
    networks:
      - apply_interview_backend-network
    volumes:
      - apply_interview_backend:/var/lib/postgresql/data

networks:
  apply_interview_backend-network:
    driver: bridge

volumes:
  apply_interview_backend:
    driver: local
